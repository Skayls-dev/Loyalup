openapi: 3.1.0
info:
  title: LoyalUp Public API
  version: 1.4.0
  description: Provider API plus Partner Identity Reconciliation, Partner Transfer, Partner Account Claim, Partner Activate, and Partner Self-Service endpoints.
servers:
  - url: https://yyftqivizzgvveeczbpv.supabase.co/functions/v1
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    PartnerApiKey:
      type: apiKey
      in: header
      name: X-Partner-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProviderApiSuccess:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
        meta:
          type: object
          properties:
            request_id:
              type: string
            timestamp:
              type: string
            api_version:
              type: string
            rate_limit_remaining:
              type: integer
    ProviderApiError:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        meta:
          type: object
          properties:
            request_id:
              type: string
            timestamp:
              type: string
            api_version:
              type: string
    PartnerTransferSuccess:
      type: object
      properties:
        success:
          type: boolean
          const: true
        status:
          type: string
          enum: [accepted, duplicate]
        transfer_id:
          type: string
          format: uuid
        transaction_ref:
          type: string
        partner_code:
          type: string
        external_user_id:
          type: string
        loyalup_user_id:
          type: string
          format: uuid
        points_delta:
          type: integer
        resulting_balance:
          type: integer
    PartnerIdentityResolveRequest:
      type: object
      required: [external_user_id]
      properties:
        external_user_id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        create_user_if_missing:
          type: boolean
          default: false
          description: If true, allows shadow creation/adoption when the user is not already linked. In sandbox this behavior is enabled by default.
        source:
          type: string
          enum: [partner-api, admin-console, support-tool, user-self-serve]
        metadata:
          type: object
    PartnerIdentityResult:
      type: object
      properties:
        success:
          type: boolean
          const: true
        case_id:
          type: string
          format: uuid
        partner_id:
          type: string
          format: uuid
        external_user_id:
          type: string
        status:
          type: string
          enum: [pending_verification, resolved, conflict, merged, rejected]
        decision:
          type: string
          enum: [create_shadow, adopt_existing, merge_required, blocked_conflict]
        next_action:
          type: string
          enum: [send_verification, complete_adoption, manual_review, merge_accounts, none]
        loyalup_user_id:
          type: [string, 'null']
          format: uuid
        requires_verification:
          type: boolean
        conflict_reason:
          type: [string, 'null']
        message:
          type: [string, 'null']
    PartnerIdentityResolveResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        identity:
          $ref: '#/components/schemas/PartnerIdentityResult'
    PartnerTransferIdentityUnresolvedError:
      type: object
      properties:
        success:
          type: boolean
          const: false
        status:
          type: string
          const: identity_unresolved
        error:
          type: string
        identity:
          $ref: '#/components/schemas/PartnerIdentityResult'
        transaction_ref:
          type: string
        partner_code:
          type: string
        external_user_id:
          type: string
    PartnerApiError:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          oneOf:
            - type: string
            - type: object
              properties:
                code:
                  type: string
                message:
                  type: string
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              message:
                type: string
                
    PartnerClaimStatusResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        status:
          type: object
          properties:
            partner_code:
              type: string
            external_user_id:
              type: string
            loyalup_user_id:
              type: string
              format: uuid
            activation_required:
              type: boolean
            email:
              type: string
              format: email
            email_masked:
              type: string
            email_confirmed_at:
              type: [string, 'null']
              format: date-time
    PartnerClaimStartResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        claim:
          type: object
          properties:
            external_user_id:
              type: string
            loyalup_user_id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            activated:
              type: boolean
            action_link:
              type: [string, 'null']
              format: uri
            email_otp:
              type: [string, 'null']
            hashed_token:
              type: [string, 'null']
            redirect_to:
              type: string
              format: uri
    PartnerActivateResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        activation:
          type: object
          properties:
            partner_code:
              type: string
            external_user_id:
              type: string
            loyalup_user_id:
              type: string
              format: uuid
            linked_user_created:
              type: boolean
            email:
              type: string
              format: email
            activated:
              type: boolean
            action_link:
              type: [string, 'null']
              format: uri
            email_otp:
              type: [string, 'null']
            hashed_token:
              type: [string, 'null']
            redirect_to:
              type: string
              format: uri
paths:
  /partner-identity-resolve:
    post:
      summary: Resolve partner identity before account claim/transfer
      description: Computes reconciliation status for a partner user (`external_user_id`) and returns the identity state machine payload required by partner UX.
      security:
        - PartnerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerIdentityResolveRequest'
            examples:
              resolve_by_email:
                value:
                  external_user_id: partner-user-123
                  email: client@example.com
                  display_name: Jane Doe
                  create_user_if_missing: false
                  source: partner-api
      responses:
        '200':
          description: Identity resolution payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerIdentityResolveResponse'
              examples:
                resolved:
                  value:
                    success: true
                    identity:
                      success: true
                      case_id: 985ba4cb-a8f6-4f4e-a90b-53e95317343b
                      partner_id: 2d58cf49-3017-434a-a2cf-ec8ff8ebec4f
                      external_user_id: partner-user-123
                      status: resolved
                      decision: adopt_existing
                      next_action: none
                      loyalup_user_id: 6f6c3551-2ad4-4b9f-b9d3-5a7876450328
                      requires_verification: false
                      conflict_reason: null
                      message: Existing account adopted
                pending_verification:
                  value:
                    success: true
                    identity:
                      success: true
                      case_id: 27396e90-b5fa-4c01-bcf5-4b3d01ff56f5
                      partner_id: 2d58cf49-3017-434a-a2cf-ec8ff8ebec4f
                      external_user_id: partner-user-123
                      status: pending_verification
                      decision: adopt_existing
                      next_action: complete_adoption
                      loyalup_user_id: null
                      requires_verification: true
                      conflict_reason: null
                      message: Partner user is not linked yet. Adoption flow is required.
                conflict:
                  value:
                    success: true
                    identity:
                      success: true
                      case_id: 7f4bcf8f-84e8-4818-b4e3-e5f15371f43d
                      partner_id: 2d58cf49-3017-434a-a2cf-ec8ff8ebec4f
                      external_user_id: partner-user-123
                      status: conflict
                      decision: blocked_conflict
                      next_action: manual_review
                      loyalup_user_id: 6f6c3551-2ad4-4b9f-b9d3-5a7876450328
                      requires_verification: false
                      conflict_reason: loyalup_user_id already linked to external_user_id=legacy-user-45
                      message: Identity conflict detected. Manual review is required.
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '401':
          description: Invalid or missing partner key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '403':
          description: Partner inactive or production access not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'

  /partner-transfers:
    post:
      summary: Credit/debit points to a LoyalUp linked user using partner credentials
      description: Requires partner-provider configuration and a resolved LoyalUp identity. In sandbox, missing users are auto-created/linked by default; in production, set `create_user_if_missing=true` to allow auto-create.
      security:
        - PartnerApiKey: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_user_id, transaction_ref, points]
              properties:
                external_user_id:
                  type: string
                email:
                  type: string
                  format: email
                transaction_ref:
                  type: string
                points:
                  type: integer
                  minimum: 1
                direction:
                  type: string
                  enum: [credit, debit]
                display_name:
                  type: string
                create_user_if_missing:
                  type: boolean
                  default: false
                  description: If true, auto-creates and links a LoyalUp user when missing. In sandbox this behavior is enabled by default.
                metadata:
                  type: object
      responses:
        '200':
          description: Accepted or duplicate transfer response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerTransferSuccess'
              examples:
                accepted:
                  value:
                    success: true
                    status: accepted
                    transfer_id: 43ab17f3-ecf0-4ce1-a47e-2ecfdbf0561b
                    transaction_ref: order-2026-03-04-0001
                    partner_code: PROVIDER_3
                    external_user_id: partner-user-123
                    loyalup_user_id: 6f6c3551-2ad4-4b9f-b9d3-5a7876450328
                    points_delta: 120
                    resulting_balance: 450
                duplicate:
                  value:
                    success: true
                    status: duplicate
                    transfer_id: 43ab17f3-ecf0-4ce1-a47e-2ecfdbf0561b
                    transaction_ref: order-2026-03-04-0001
                    partner_code: PROVIDER_3
                    external_user_id: partner-user-123
                    loyalup_user_id: 6f6c3551-2ad4-4b9f-b9d3-5a7876450328
                    points_delta: 120
                    resulting_balance: 450
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '401':
          description: Invalid or missing partner key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '403':
          description: Partner inactive or production access not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '404':
          description: Identity unresolved (typically pending verification) or user not linked with auto-link disabled
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PartnerTransferIdentityUnresolvedError'
                  - $ref: '#/components/schemas/PartnerApiError'
              examples:
                identity_unresolved_pending:
                  value:
                    success: false
                    status: identity_unresolved
                    error: Partner identity is not resolved
                    identity:
                      success: true
                      case_id: 27396e90-b5fa-4c01-bcf5-4b3d01ff56f5
                      partner_id: 2d58cf49-3017-434a-a2cf-ec8ff8ebec4f
                      external_user_id: partner-user-123
                      status: pending_verification
                      decision: adopt_existing
                      next_action: complete_adoption
                      loyalup_user_id: null
                      requires_verification: true
                      conflict_reason: null
                      message: Partner user is not linked yet. Adoption flow is required.
                    transaction_ref: order-2026-03-04-0002
                    partner_code: PROVIDER_3
                    external_user_id: partner-user-123
        '409':
          description: Transfer rejected (e.g. insufficient_balance, partner/provider setup issue, or identity conflict)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PartnerTransferIdentityUnresolvedError'
                  - $ref: '#/components/schemas/PartnerApiError'
              examples:
                identity_unresolved_conflict:
                  value:
                    success: false
                    status: identity_unresolved
                    error: Identity conflict detected. Manual review is required.
                    identity:
                      success: true
                      case_id: 7f4bcf8f-84e8-4818-b4e3-e5f15371f43d
                      partner_id: 2d58cf49-3017-434a-a2cf-ec8ff8ebec4f
                      external_user_id: partner-user-123
                      status: conflict
                      decision: blocked_conflict
                      next_action: manual_review
                      loyalup_user_id: 6f6c3551-2ad4-4b9f-b9d3-5a7876450328
                      requires_verification: false
                      conflict_reason: loyalup_user_id already linked to external_user_id=legacy-user-45
                      message: Identity conflict detected. Manual review is required.
                    transaction_ref: order-2026-03-04-0003
                    partner_code: PROVIDER_3
                    external_user_id: partner-user-123
                rejected_balance:
                  value:
                    success: false
                    status: rejected
                    error: insufficient_balance
                    transaction_ref: order-2026-03-04-0004
                    partner_code: PROVIDER_3

  /partner-account-claim:
    post:
      summary: Get activation status or start claim flow for a linked partner user
      description: In sandbox, START_CLAIM can auto-create and auto-activate a missing linked user for test emails.
      security:
        - PartnerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action, external_user_id]
                  properties:
                    action:
                      type: string
                      enum: [GET_STATUS]
                    external_user_id:
                      type: string
                - type: object
                  required: [action, external_user_id, email]
                  properties:
                    action:
                      type: string
                      enum: [START_CLAIM]
                    external_user_id:
                      type: string
                    email:
                      type: string
                      format: email
                    redirect_to:
                      type: string
                      format: uri
      responses:
        '200':
          description: Status payload or claim payload with action_link (returned to caller; no partner-side email/SMS dispatch by default)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PartnerClaimStatusResponse'
                  - $ref: '#/components/schemas/PartnerClaimStartResponse'
              examples:
                get_status:
                  value:
                    success: true
                    status:
                      partner_code: PROVIDER_3
                      external_user_id: partner-user-123
                      loyalup_user_id: 6f6c3551-2ad4-4b9f-b9d3-5a7876450328
                      activation_required: true
                      email: client@example.com
                      email_masked: cl***@example.com
                      email_confirmed_at: null
                start_claim:
                  value:
                    success: true
                    claim:
                      external_user_id: partner-user-123
                      loyalup_user_id: 6f6c3551-2ad4-4b9f-b9d3-5a7876450328
                      email: client@example.com
                      action_link: https://yyftqivizzgvveeczbpv.supabase.co/auth/v1/verify
                      email_otp: '123456'
                      hashed_token: token_hash
                      redirect_to: https://loyalup-pink.vercel.app/auth/callback
                start_claim_sandbox_auto:
                  value:
                    success: true
                    claim:
                      external_user_id: sandbox-user-123
                      loyalup_user_id: 6f6c3551-2ad4-4b9f-b9d3-5a7876450328
                      email: noreal@example.test
                      activated: true
                      action_link: null
                      email_otp: null
                      hashed_token: null
                      redirect_to: https://loyalup-pink.vercel.app/auth/callback
        '400':
          description: Invalid action or payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '401':
          description: Invalid partner key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '403':
          description: Partner inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '404':
          description: User link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '409':
          description: Claim conflict (e.g. email collision)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'

  /loyalup-account-claim:
    post:
      summary: Compatibility alias of /partner-account-claim
      description: Compatibility alias with the same sandbox auto-create/auto-activate behavior as /partner-account-claim.
      security:
        - PartnerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action, external_user_id]
                  properties:
                    action:
                      type: string
                      enum: [GET_STATUS]
                    external_user_id:
                      type: string
                - type: object
                  required: [action, external_user_id, email]
                  properties:
                    action:
                      type: string
                      enum: [START_CLAIM]
                    external_user_id:
                      type: string
                    email:
                      type: string
                      format: email
                    redirect_to:
                      type: string
                      format: uri
      responses:
        '200':
          description: Status payload or claim payload with action_link (returned to caller; no partner-side email/SMS dispatch by default)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PartnerClaimStatusResponse'
                  - $ref: '#/components/schemas/PartnerClaimStartResponse'
              examples:
                get_status:
                  value:
                    success: true
                    status:
                      partner_code: PROVIDER_3
                      external_user_id: partner-user-123
                      loyalup_user_id: 6f6c3551-2ad4-4b9f-b9d3-5a7876450328
                      activation_required: true
                      email: client@example.com
                      email_masked: cl***@example.com
                      email_confirmed_at: null
                start_claim:
                  value:
                    success: true
                    claim:
                      external_user_id: partner-user-123
                      loyalup_user_id: 6f6c3551-2ad4-4b9f-b9d3-5a7876450328
                      email: client@example.com
                      action_link: https://yyftqivizzgvveeczbpv.supabase.co/auth/v1/verify
                      email_otp: '123456'
                      hashed_token: token_hash
                      redirect_to: https://loyalup-pink.vercel.app/auth/callback
                start_claim_sandbox_auto:
                  value:
                    success: true
                    claim:
                      external_user_id: sandbox-user-123
                      loyalup_user_id: 6f6c3551-2ad4-4b9f-b9d3-5a7876450328
                      email: noreal@example.test
                      activated: true
                      action_link: null
                      email_otp: null
                      hashed_token: null
                      redirect_to: https://loyalup-pink.vercel.app/auth/callback
        '400':
          description: Invalid action or payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '401':
          description: Invalid partner key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '403':
          description: Partner inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '404':
          description: User link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '409':
          description: Claim conflict (e.g. email collision)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'

  /partner-activate:
    post:
      summary: One-call partner activation (auto-link if needed, then generate action_link)
      description: In sandbox, missing users are auto-created and auto-activated without requiring a real email confirmation flow.
      security:
        - PartnerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_user_id, email]
              properties:
                external_user_id:
                  type: string
                email:
                  type: string
                  format: email
                display_name:
                  type: string
                redirect_to:
                  type: string
                  format: uri
                create_user_if_missing:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Activation payload with action_link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerActivateResponse'
              examples:
                activated:
                  value:
                    success: true
                    activation:
                      partner_code: PROVIDER_3
                      external_user_id: partner-user-123
                      loyalup_user_id: 6f6c3551-2ad4-4b9f-b9d3-5a7876450328
                      linked_user_created: true
                      email: client@example.com
                      action_link: https://yyftqivizzgvveeczbpv.supabase.co/auth/v1/verify
                      email_otp: '123456'
                      hashed_token: token_hash
                      redirect_to: https://loyalup-pink.vercel.app/auth/callback
                activated_sandbox_auto:
                  value:
                    success: true
                    activation:
                      partner_code: PROVIDER_3
                      external_user_id: sandbox-user-123
                      loyalup_user_id: 6f6c3551-2ad4-4b9f-b9d3-5a7876450328
                      linked_user_created: true
                      email: noreal@example.test
                      activated: true
                      action_link: null
                      email_otp: null
                      hashed_token: null
                      redirect_to: https://loyalup-pink.vercel.app/auth/callback
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '401':
          description: Invalid partner key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '403':
          description: Partner inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '404':
          description: User link not found and auto-link disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '409':
          description: Activation conflict (e.g. email collision)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'

  /partner-self-service:
    post:
      summary: Partner onboarding and key management for authenticated providers
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action]
                  properties:
                    action:
                      type: string
                      enum: [GET_PROFILE]
                - type: object
                  required: [action, code, name]
                  properties:
                    action:
                      type: string
                      enum: [UPSERT_PROFILE]
                    code:
                      type: string
                      pattern: '^[A-Z0-9_\\-]{2,40}$'
                    name:
                      type: string
                - type: object
                  required: [action]
                  properties:
                    action:
                      type: string
                      enum: [LIST_KEYS]
                - type: object
                  required: [action]
                  properties:
                    action:
                      type: string
                      enum: [CREATE_KEY]
                    environment:
                      type: string
                      enum: [sandbox, production]
                    scopes:
                      type: array
                      items:
                        type: string
                        enum: [transfers:write, transfers:read]
                    expires_at:
                      type: [string, 'null']
                      format: date-time
                - type: object
                  required: [action]
                  properties:
                    action:
                      type: string
                      enum: [REQUEST_PRODUCTION_ACCESS]
                    notes:
                      type: string
                      maxLength: 500
                - type: object
                  required: [action]
                  properties:
                    action:
                      type: string
                      enum: [LIST_REQUESTS]
      responses:
        '200':
          description: Action result
          content:
            application/json:
              schema:
                type: object
              examples:
                get_profile:
                  value:
                    success: true
                    partner:
                      id: 7b8c4d4b-cc4e-4d55-9b6e-6b7db8e0f5e2
                      code: KUVAAGO-PRNC
                      name: Kuvaago
                      status: sandbox_active
                    can_use_production: false
                upsert_profile:
                  value:
                    success: true
                    partner:
                      id: 7b8c4d4b-cc4e-4d55-9b6e-6b7db8e0f5e2
                      code: KUVAAGO-PRNC
                      name: Kuvaago Principal
                      status: sandbox_active
                create_key:
                  value:
                    success: true
                    key: lu_pk_sandbox_xxxxxxxxxxxxxxxxxxxxxxxxx
                    key_once: true
                    credential:
                      id: d21a7679-1c1c-4b32-bd3b-e4fb67ac1bf1
                      environment: sandbox
                      scopes: [transfers:write]
                      is_active: true
                request_production:
                  value:
                    success: true
                    request:
                      id: 1e96a74f-5a23-4f20-b3f8-cf28dece02b8
                      status: pending
        '400':
          description: Invalid action or payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '403':
          description: Forbidden (e.g. production key requested without approval)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '404':
          description: Provider profile not found for authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '409':
          description: Conflict (e.g. duplicate partner code or existing pending request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'

