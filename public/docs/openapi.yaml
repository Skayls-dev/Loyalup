openapi: 3.1.0
info:
  title: LoyalUp Public API
  version: 1.1.0
  description: Provider API plus Partner Transfer, Partner Account Claim, and Partner Activate endpoints.
servers:
  - url: https://yyftqivizzgvveeczbpv.supabase.co/functions/v1
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    PartnerApiKey:
      type: apiKey
      in: header
      name: X-Partner-Key
  schemas:
    ProviderApiSuccess:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
        meta:
          type: object
          properties:
            request_id:
              type: string
            timestamp:
              type: string
            api_version:
              type: string
            rate_limit_remaining:
              type: integer
    ProviderApiError:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        meta:
          type: object
          properties:
            request_id:
              type: string
            timestamp:
              type: string
            api_version:
              type: string
    PartnerTransferSuccess:
      type: object
      properties:
        success:
          type: boolean
          const: true
        status:
          type: string
          enum: [accepted, duplicate]
        transfer_id:
          type: string
          format: uuid
        transaction_ref:
          type: string
        partner_code:
          type: string
        external_user_id:
          type: string
        loyalup_user_id:
          type: string
          format: uuid
        points_delta:
          type: integer
        resulting_balance:
          type: integer
    PartnerApiError:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          oneOf:
            - type: string
            - type: object
              properties:
                code:
                  type: string
                message:
                  type: string
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              message:
                type: string
    PartnerClaimStatusResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        status:
          type: object
          properties:
            partner_code:
              type: string
            external_user_id:
              type: string
            loyalup_user_id:
              type: string
              format: uuid
            activation_required:
              type: boolean
            email:
              type: string
              format: email
            email_masked:
              type: string
            email_confirmed_at:
              type: [string, 'null']
              format: date-time
    PartnerClaimStartResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        claim:
          type: object
          properties:
            external_user_id:
              type: string
            loyalup_user_id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            action_link:
              type: string
              format: uri
            email_otp:
              type: string
            hashed_token:
              type: string
            redirect_to:
              type: string
              format: uri
    PartnerActivateResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        activation:
          type: object
          properties:
            partner_code:
              type: string
            external_user_id:
              type: string
            loyalup_user_id:
              type: string
              format: uuid
            linked_user_created:
              type: boolean
            email:
              type: string
              format: email
            action_link:
              type: string
              format: uri
            email_otp:
              type: string
            hashed_token:
              type: string
            redirect_to:
              type: string
              format: uri
paths:
  /partner-transfers:
    post:
      summary: Credit/debit points to a LoyalUp linked user using partner credentials
      security:
        - PartnerApiKey: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_user_id, transaction_ref, points]
              properties:
                external_user_id:
                  type: string
                email:
                  type: string
                  format: email
                transaction_ref:
                  type: string
                points:
                  type: integer
                  minimum: 1
                direction:
                  type: string
                  enum: [credit, debit]
                display_name:
                  type: string
                create_user_if_missing:
                  type: boolean
                metadata:
                  type: object
      responses:
        '200':
          description: Accepted or duplicate transfer response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerTransferSuccess'
              examples:
                accepted:
                  value:
                    success: true
                    status: accepted
                    transfer_id: 43ab17f3-ecf0-4ce1-a47e-2ecfdbf0561b
                    transaction_ref: order-2026-03-04-0001
                    partner_code: PROVIDER_3
                    external_user_id: partner-user-123
                    loyalup_user_id: 6f6c3551-2ad4-4b9f-b9d3-5a7876450328
                    points_delta: 120
                    resulting_balance: 450
                duplicate:
                  value:
                    success: true
                    status: duplicate
                    transfer_id: 43ab17f3-ecf0-4ce1-a47e-2ecfdbf0561b
                    transaction_ref: order-2026-03-04-0001
                    partner_code: PROVIDER_3
                    external_user_id: partner-user-123
                    loyalup_user_id: 6f6c3551-2ad4-4b9f-b9d3-5a7876450328
                    points_delta: 120
                    resulting_balance: 450
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '401':
          description: Invalid or missing partner key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '403':
          description: Partner inactive or production access not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '409':
          description: Transfer rejected (e.g. insufficient_balance)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'

  /partner-account-claim:
    post:
      summary: Get activation status or start claim flow for a linked partner user
      security:
        - PartnerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action, external_user_id]
                  properties:
                    action:
                      type: string
                      enum: [GET_STATUS]
                    external_user_id:
                      type: string
                - type: object
                  required: [action, external_user_id, email]
                  properties:
                    action:
                      type: string
                      enum: [START_CLAIM]
                    external_user_id:
                      type: string
                    email:
                      type: string
                      format: email
                    redirect_to:
                      type: string
                      format: uri
      responses:
        '200':
          description: Status payload or claim payload with action_link (returned to caller; no partner-side email/SMS dispatch by default)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PartnerClaimStatusResponse'
                  - $ref: '#/components/schemas/PartnerClaimStartResponse'
              examples:
                get_status:
                  value:
                    success: true
                    status:
                      partner_code: PROVIDER_3
                      external_user_id: partner-user-123
                      loyalup_user_id: 6f6c3551-2ad4-4b9f-b9d3-5a7876450328
                      activation_required: true
                      email: client@example.com
                      email_masked: cl***@example.com
                      email_confirmed_at: null
                start_claim:
                  value:
                    success: true
                    claim:
                      external_user_id: partner-user-123
                      loyalup_user_id: 6f6c3551-2ad4-4b9f-b9d3-5a7876450328
                      email: client@example.com
                      action_link: https://yyftqivizzgvveeczbpv.supabase.co/auth/v1/verify
                      email_otp: '123456'
                      hashed_token: token_hash
                      redirect_to: https://loyalup-pink.vercel.app/auth/callback
        '400':
          description: Invalid action or payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '401':
          description: Invalid partner key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '403':
          description: Partner inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '404':
          description: User link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '409':
          description: Claim conflict (e.g. email collision)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'

  /loyalup-account-claim:
    post:
      summary: Compatibility alias of /partner-account-claim
      security:
        - PartnerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action, external_user_id]
                  properties:
                    action:
                      type: string
                      enum: [GET_STATUS]
                    external_user_id:
                      type: string
                - type: object
                  required: [action, external_user_id, email]
                  properties:
                    action:
                      type: string
                      enum: [START_CLAIM]
                    external_user_id:
                      type: string
                    email:
                      type: string
                      format: email
                    redirect_to:
                      type: string
                      format: uri
      responses:
        '200':
          description: Status payload or claim payload with action_link (returned to caller; no partner-side email/SMS dispatch by default)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PartnerClaimStatusResponse'
                  - $ref: '#/components/schemas/PartnerClaimStartResponse'
              examples:
                get_status:
                  value:
                    success: true
                    status:
                      partner_code: PROVIDER_3
                      external_user_id: partner-user-123
                      loyalup_user_id: 6f6c3551-2ad4-4b9f-b9d3-5a7876450328
                      activation_required: true
                      email: client@example.com
                      email_masked: cl***@example.com
                      email_confirmed_at: null
                start_claim:
                  value:
                    success: true
                    claim:
                      external_user_id: partner-user-123
                      loyalup_user_id: 6f6c3551-2ad4-4b9f-b9d3-5a7876450328
                      email: client@example.com
                      action_link: https://yyftqivizzgvveeczbpv.supabase.co/auth/v1/verify
                      email_otp: '123456'
                      hashed_token: token_hash
                      redirect_to: https://loyalup-pink.vercel.app/auth/callback
        '400':
          description: Invalid action or payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '401':
          description: Invalid partner key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '403':
          description: Partner inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '404':
          description: User link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '409':
          description: Claim conflict (e.g. email collision)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'

  /partner-activate:
    post:
      summary: One-call partner activation (auto-link if needed, then generate action_link)
      security:
        - PartnerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_user_id, email]
              properties:
                external_user_id:
                  type: string
                email:
                  type: string
                  format: email
                display_name:
                  type: string
                redirect_to:
                  type: string
                  format: uri
                create_user_if_missing:
                  type: boolean
      responses:
        '200':
          description: Activation payload with action_link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerActivateResponse'
              examples:
                activated:
                  value:
                    success: true
                    activation:
                      partner_code: PROVIDER_3
                      external_user_id: partner-user-123
                      loyalup_user_id: 6f6c3551-2ad4-4b9f-b9d3-5a7876450328
                      linked_user_created: true
                      email: client@example.com
                      action_link: https://yyftqivizzgvveeczbpv.supabase.co/auth/v1/verify
                      email_otp: '123456'
                      hashed_token: token_hash
                      redirect_to: https://loyalup-pink.vercel.app/auth/callback
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '401':
          description: Invalid partner key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '403':
          description: Partner inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '404':
          description: User link not found and auto-link disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'
        '409':
          description: Activation conflict (e.g. email collision)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApiError'

  /api-v1-clients:
    get:
      summary: List clients
      responses:
        '200':
          description: Clients list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderApiSuccess'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderApiError'

  /api-v1-transactions:
    get:
      summary: List transactions
      responses:
        '200':
          description: Transaction list
    post:
      summary: Create a POS transaction
      responses:
        '200':
          description: Created transaction

  /api-v1-services:
    get:
      summary: List provider services
      responses:
        '200':
          description: Service list
    post:
      summary: Create service
      responses:
        '200':
          description: Created service
    put:
      summary: Update service
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated service

  /api-v1-promotions:
    get:
      summary: List active promotions
      responses:
        '200':
          description: Promotion list
    post:
      summary: Create promotion
      responses:
        '200':
          description: Created promotion

  /api-v1-stats:
    get:
      summary: Get provider stats
      responses:
        '200':
          description: Stats summary

  /api-v1-sandbox:
    get:
      summary: Sandbox status/echo endpoint (sandbox keys only)
      parameters:
        - in: query
          name: mode
          schema:
            type: string
            enum: [status, echo]
      responses:
        '200':
          description: Sandbox response
